name: Toolchain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.17
          sha256: fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: false

      - name: Print tool versions
        run: |
          mise --version
          python --version
          uv --version
          pre-commit --version
          cz version

      - name: Assert every mise-action step pins the mise version and binary checksum
        run: mise run check:mise-pins

      - name: Assert UV_PYTHON equals the mise python pin
        run: |
          python_pin=$(sed -n 's/^python = "\(.*\)"$/\1/p' mise.toml)
          uv_python=$(sed -n 's/^UV_PYTHON = "\(.*\)"$/\1/p' mise.toml)
          test -n "$python_pin"
          test "$uv_python" = "$python_pin" || {
            echo "UV_PYTHON is $uv_python but mise.toml pins python $python_pin." >&2
            exit 1
          }

      - name: Assert pyproject.toml requires the mise uv pin
        run: |
          required=$(sed -n 's/^required-version = "==\(.*\)"$/\1/p' pyproject.toml)
          test "$required" = "$(mise current uv)" || {
            echo "pyproject.toml requires uv $required, but mise.toml pins $(mise current uv)." >&2
            exit 1
          }

      - name: Assert the toolchain lock is current
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise run lock:toolchain && test -z "$(git status --porcelain -- 'mise*.lock' .mise/locks)"

  shared-scripts:
    name: Shared toolchain scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the locked toolchain
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.17
          sha256: fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert the shared toolchain scripts match the same-named branch, else main, of the public repositories
        run: mise run check:toolchain-scripts
