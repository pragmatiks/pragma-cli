default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: check-comments
        name: Enforce NO COMMENTS policy
        entry: python -m pragmatiks_lint.comments
        language: python
        language_version: python3.13
        additional_dependencies: ["pragmatiks-lint==0.11.0"]
        types: [python]
        pass_filenames: true
        stages: [pre-commit]
      - id: check-sources
        name: Reject non-registry dependency sources
        entry: python -m pragmatiks_lint.sources
        language: python
        language_version: python3.13
        additional_dependencies: ["pragmatiks-lint==0.11.0"]
        files: (^|/)(pyproject\.toml|package\.json|pnpm-workspace\.yaml)$
        pass_filenames: true
        stages: [pre-commit]
      - id: check-uv-pip
        name: Reject uv pip in tracked files
        entry: python -m pragmatiks_lint.uv_pip
        language: python
        language_version: python3.13
        additional_dependencies: ["pragmatiks-lint==0.11.0"]
        pass_filenames: true
        stages: [pre-commit]
      - id: check-unittest
        name: Prevent unittest.mock usage
        entry: scripts/check_unittest.py
        language: system
        types: [python]
        pass_filenames: true
        stages: [pre-commit]
      - id: ty
        name: ty type checker
        entry: env -u VIRTUAL_ENV uv run --locked ty check
        language: system
        types: [python]
        pass_filenames: false

  - repo: local
    hooks:
      - id: commitizen
        name: commitizen check
        entry: mise exec -- cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
